<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bobber Forever">
  <title>Bobber Forever</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a4f"/>
      <stop offset="1" stop-color="#06121a"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="60%" r="55%">
      <stop offset="0" stop-color="#66ccff" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#2f8fc0" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#2f8fc0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66ccff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#21648a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#66ccff" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="cork" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9ab7a"/>
      <stop offset="0.35" stop-color="#f1e6bd"/>
      <stop offset="0.7" stop-color="#d9caa0"/>
      <stop offset="1" stop-color="#8f8259"/>
    </linearGradient>

    <linearGradient id="corkTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8cc9f"/>
      <stop offset="1" stop-color="#fff6d6"/>
    </linearGradient>

    <linearGradient id="red" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#c8241a"/>
      <stop offset="1" stop-color="#ff6a4a"/>
    </linearGradient>

    <linearGradient id="blue" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#1f3fa8"/>
      <stop offset="1" stop-color="#5a8cff"/>
    </linearGradient>

    <linearGradient id="spike" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a3138"/>
      <stop offset="0.5" stop-color="#8a96a0"/>
      <stop offset="1" stop-color="#2a3138"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#glow)"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- ondas -->
  <g fill="none" stroke="#66ccff" stroke-linecap="round">
    <ellipse cx="270" cy="352" rx="200" ry="46" stroke-width="5" stroke-opacity="0.22"/>
    <ellipse cx="270" cy="352" rx="148" ry="34" stroke-width="6" stroke-opacity="0.4"/>
    <ellipse cx="270" cy="352" rx="100" ry="23" stroke-width="7" stroke-opacity="0.7"/>
  </g>

  <!-- corcho -->
  <path d="M186 214 L 200 336 Q 270 362 340 336 L 354 214 Z" fill="url(#cork)"/>
  <ellipse cx="270" cy="214" rx="84" ry="22" fill="url(#corkTop)"/>
  <ellipse cx="270" cy="214" rx="84" ry="22" fill="none" stroke="#7d7150" stroke-opacity="0.6" stroke-width="3"/>
  <g fill="#8f8259" fill-opacity="0.45">
    <circle cx="232" cy="262" r="4"/>
    <circle cx="300" cy="248" r="3"/>
    <circle cx="318" cy="290" r="4"/>
    <circle cx="252" cy="306" r="3"/>
    <circle cx="282" cy="276" r="2.5"/>
  </g>

  <!-- plumas -->
  <g transform="translate(540 0) scale(-1 1)">
    <path d="M282 150 C 230 110, 160 92, 92 108 C 150 118, 200 136, 262 172 Z" fill="url(#blue)"/>
    <path d="M262 150 C 248 146, 150 120, 120 112" fill="none" stroke="#b9d0ff" stroke-opacity="0.6" stroke-width="3"/>
    <path d="M280 168 C 220 150, 150 160, 84 196 C 150 182, 210 184, 262 190 Z" fill="url(#red)"/>
    <path d="M262 180 C 230 172, 150 176, 112 186" fill="none" stroke="#ffc2b0" stroke-opacity="0.6" stroke-width="3"/>
  </g>

  <!-- punta, clavada en el centro del corcho -->
  <ellipse cx="270" cy="212" rx="12" ry="4" fill="#5c5238" fill-opacity="0.6"/>
  <path d="M270 72 L 284 112 L 279 211 Q 270 216 261 211 L 256 112 Z" fill="url(#spike)"/>

  <!-- linea del agua -->
  <path d="M198 314 Q 270 340 342 314 L 341 338 Q 270 364 199 338 Z" fill="#0b2433" fill-opacity="0.55"/>
  <ellipse cx="270" cy="326" rx="96" ry="18" fill="none" stroke="#d6f1ff" stroke-opacity="0.85" stroke-width="5"/>
</svg>
